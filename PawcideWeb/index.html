<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawcide</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #111;
            font-family: sans-serif;
        }

        #section-1 {
            position: relative;
            z-index: 2; 
            width: 100%;
            aspect-ratio: 352 / 192; 
            background-image: url('BackgroundS1.png');
            background-repeat: no-repeat;
            background-size: 100% auto;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-wrapper {
            width: 100%;
            max-width: 600px; 
            padding: 20px;
            margin-top: 5vh;
            display: grid; 
            place-items: center;
            cursor: pointer;
        }

        .title-wrapper img {
            grid-area: 1 / 1; 
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: opacity 0.05s ease; 
        }

        .title-wrapper.playing #title-gif { opacity: 1; pointer-events: auto; }
        .title-wrapper.playing #title-still { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-gif { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-still { opacity: 1; pointer-events: auto; }

        #section-2 {
            position: relative;
            z-index: 1; 
            margin-top: -15vw; 
            padding: 15vw 20px 60px 20px;
            width: 100%;
            background-image: url('BackgroundS2.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollS2 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            justify-content: center;
        }

        @keyframes scrollS2 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #section-3 {
            width: 100%;
            padding: 60px 0; 
            overflow: hidden; 
            background-image: url('BackgroundS3.gif');
            background-repeat: repeat;
            background-size: 180px 180px; 
            animation: scrollS3 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px; 
        }

        @keyframes scrollS3 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .games-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            padding: 0 20px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            display: flex;
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .marquee-container:active {
            cursor: grabbing; 
        }

        .marquee-track {
            display: flex;
            gap: 40px; 
            padding-right: 40px; 
            width: max-content;
            animation: loopMarquee 40s linear infinite; 
        }

        .marquee-item {
            flex: 0 0 280px; 
            height: 280px;
            background-color: transparent; 
            border: 6px solid #000; 
            border-radius: 4px;
            overflow: hidden;
        }

        .marquee-item.wide {
            flex: 0 0 480px; 
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-container:active .marquee-track {
            animation-play-state: paused;
        }

        @keyframes loopMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000; 
            pointer-events: auto;
            animation: multiEdgeFloat var(--duration) linear forwards;
        }

        .floating-gif-item {
            width: 64px; 
            height: 64px;
            display: block;
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            user-select: none;
            -webkit-user-select: none; 
        }

        .floating-gif-item.shrinking {
            animation: slowThenFastShrink 1.0s linear forwards;
            pointer-events: none; 
        }

        @keyframes multiEdgeFloat {
            0% {
                transform: translate(var(--start-x), var(--start-y)) rotate(0deg);
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) rotate(var(--total-rot));
            }
        }

        @keyframes slowThenFastShrink {
            0% { transform: scale(1); }
            65% { transform: scale(0.7); } 
            100% { transform: scale(0); }
        }
    </style>
</head>
<body>

    <section id="section-1">
        <div id="title-container" class="title-wrapper playing">
            <img id="title-gif" src="PawcideS1.gif" alt="Pawcide Animated Title">
            <img id="title-still" src="PawcideS1_still.png" alt="Pawcide Static Title">
        </div>
    </section>

    <section id="section-2">
        <img src="AboutMeS2.png" alt="About Robin" class="about-image">
    </section>

    <section id="section-3">
        <img src="GamesS3.png" alt="Games Info" class="games-image">

        <div class="marquee-container">
            <div class="marquee-track">
                <div class="marquee-item"><img src="Alien Fight2.gif" alt="Alien Fight"></div>
                <div class="marquee-item"><img src="Conspiracy.png" alt="Conspiracy"></div>
                <div class="marquee-item"><img src="Lamp.png" alt="Lamp"></div>
                <div class="marquee-item"><img src="pumpkin field.png" alt="Pumpkin Field"></div>
                <div class="marquee-item"><img src="Walking Candle.gif" alt="Walking Candle"></div>
                <div class="marquee-item"><img src="birds.png" alt="Birds"></div>
                <div class="marquee-item"><img src="Electricity.png" alt="Electricity"></div>
                <div class="marquee-item"><img src="BarmovBP.png" alt="BarmovBP"></div>
                <div class="marquee-item"><img src="Cresta.png" alt="Cresta"></div>
                <div class="marquee-item"><img src="Lipstick.gif" alt="Lipstick"></div>
                <div class="marquee-item"><img src="blueberries.png" alt="Blueberries"></div>
                <div class="marquee-item wide"><img src="paper pond.png" alt="Paper Pond"></div>

                <div class="marquee-item"><img src="Alien Fight2.gif" alt="Alien Fight"></div>
                <div class="marquee-item"><img src="Conspiracy.png" alt="Conspiracy"></div>
                <div class="marquee-item"><img src="Lamp.png" alt="Lamp"></div>
                <div class="marquee-item"><img src="pumpkin field.png" alt="Pumpkin Field"></div>
                <div class="marquee-item"><img src="Walking Candle.gif" alt="Walking Candle"></div>
                <div class="marquee-item"><img src="birds.png" alt="Birds"></div>
                <div class="marquee-item"><img src="Electricity.png" alt="Electricity"></div>
                <div class="marquee-item"><img src="BarmovBP.png" alt="BarmovBP"></div>
                <div class="marquee-item"><img src="Cresta.png" alt="Cresta"></div>
                <div class="marquee-item"><img src="Lipstick.gif" alt="Lipstick"></div>
                <div class="marquee-item"><img src="blueberries.png" alt="Blueberries"></div>
                <div class="marquee-item wide"><img src="paper pond.png" alt="Paper Pond"></div>
            </div>
        </div>
    </section>

    <script>
        const GIF_DURATION = 1800; 
        const GIF_SRC = 'PawcideS1.gif';
        const titleContainer = document.getElementById('title-container');
        const titleGif = document.getElementById('title-gif');
        let timerId = null;

        function playAnimation() {
            clearTimeout(timerId);
            titleContainer.classList.remove('stopped');
            titleContainer.classList.add('playing');
            titleGif.src = GIF_SRC + '?t=' + new Date().getTime();

            timerId = setTimeout(() => {
                titleContainer.classList.remove('playing');
                titleContainer.classList.add('stopped');
            }, GIF_DURATION);
        }
        window.addEventListener('load', playAnimation);
        titleContainer.addEventListener('click', playAnimation);

        const SPAWN_POOL = ['Yourefunny.gif', 'Wave.gif', 'Silly.gif'];
        const MAX_SCREEN_ITEMS = 5;    
        const SPAWN_INTERVAL_MS = 4000; 

        function createFloatingElement() {
            if (document.querySelectorAll('.floating-container').length >= MAX_SCREEN_ITEMS) {
                return;
            }

            const container = document.createElement('div');
            container.classList.add('floating-container');

            const gif = document.createElement('img');
            gif.src = SPAWN_POOL[Math.floor(Math.random() * SPAWN_POOL.length)];
            gif.alt = "Floating Arcade Asset";
            gif.classList.add('floating-gif-item');

            const edges = ['bottom', 'top', 'left'];
            const chosenEdge = edges[Math.floor(Math.random() * edges.length)];

            let startX, startY, endX, endY;

            if (chosenEdge === 'bottom') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '105vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '-10vh';
            } else if (chosenEdge === 'top') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '-10vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '105vh';
            } else if (chosenEdge === 'left') {
                startX = '-10vw';
                startY = Math.floor(Math.random() * 90) + 5 + 'vh';
                endX = '105vw';
                endY = `calc(${startY} + ${(Math.random() * 20 - 10)}vh)`;
            }

            const flightTime = (Math.random() * 6 + 12) + 's';
            const turnSpeed = (Math.random() * 240 + 120) * (Math.random() > 0.5 ? 1 : -1) + 'deg';

            container.style.setProperty('--start-x', startX);
            container.style.setProperty('--start-y', startY);
            container.style.setProperty('--end-x', endX);
            container.style.setProperty('--end-y', endY);
            container.style.setProperty('--duration', flightTime);
            container.style.setProperty('--total-rot', turnSpeed);

            gif.addEventListener('click', () => {
                gif.classList.add('shrinking');
                gif.addEventListener('animationend', () => {
                    container.remove();
                }, { once: true });
            });

            container.addEventListener('animationend', (e) => {
                if (e.target === container) {
                    container.remove();
                }
            });

            container.appendChild(gif);
            document.body.appendChild(container);
        }

        setInterval(createFloatingElement, SPAWN_INTERVAL_MS);
    </script>

</body>
</html>
