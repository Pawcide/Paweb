<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawcide</title>
    <link rel="icon" type="image/png" href="WebIcon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #111;
            font-family: sans-serif;
        }

        #section-1 {
            position: relative;
            z-index: 2; 
            width: 100%;
            aspect-ratio: 352 / 192; 
            background-image: url('BackgroundS1.png');
            background-repeat: no-repeat;
            background-size: 100% auto;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-wrapper {
            width: 100%;
            max-width: 600px; 
            padding: 20px;
            margin-top: 5vh;
            display: grid; 
            place-items: center;
            cursor: pointer;
        }

        .title-wrapper img {
            grid-area: 1 / 1; 
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: opacity 0.05s ease; 
        }

        .title-wrapper.playing #title-gif { opacity: 1; pointer-events: auto; }
        .title-wrapper.playing #title-still { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-gif { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-still { opacity: 1; pointer-events: auto; }

        #section-2 {
            position: relative;
            z-index: 1; 
            margin-top: -15vw; 
            padding: 15vw 20px 60px 20px;
            width: 100%;
            background-image: url('BackgroundS2.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollS2 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes scrollS2 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .clicked-cats-wrapper {
            position: relative; 
            width: 100%;
            max-width: 650px;
            margin-top: 40px;
        }

        .certRowThingHolder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .certImgIdk {
            width: 320px;
            height: auto;
            image-rendering: pixelated;
            filter: grayscale(100%) brightness(0.3);
            opacity: 0.5;
            transition: filter 0.2s, opacity 0.2s;
            cursor: pointer;
        }

        .certImgIdk.certDoneYay {
            filter: none;
            opacity: 1;
        }

        .certFlyBoiOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .certFlyBoiImg {
            width: min(80vw, 500px);
            image-rendering: pixelated;
            will-change: transform, opacity;
        }

        .clicked-cats-image {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .clicked-cats-row {
            position: absolute; 
            top: 27%; 
            bottom: 50%;
            left: 6%;
            right: 6%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start; 
            gap: 3% 2%;
        }

        .rare-cats-row {
            position: absolute;
            top: 77%;
            bottom: 3%;
            left: 6%;
            right: 6%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 3% 2%;
        }

        .clicked-cats-row img {
            width: 10.5%; 
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: grayscale(100%) brightness(0.1) contrast(0.7); 
            transition: filter 0.3s ease; 
        }

        /* only 4 of these so they can be chonkier than the regular row, no wrap needed */
        .rare-cats-row img {
            width: 14%; 
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: grayscale(100%) brightness(0.1) contrast(0.7); 
            transition: filter 0.3s ease; 
        }

        .clicked-cats-row img.unlocked,
        .rare-cats-row img.unlocked {
            filter: none; 
        }

        #section-3 {
            width: 100%;
            padding: 60px 0; 
            overflow: hidden; 
            background-image: url('BackgroundS3.gif');
            background-repeat: repeat;
            background-size: 180px 180px; 
            animation: scrollS3 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px; 
        }

        @keyframes scrollS3 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .games-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            padding: 0 20px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* the button img itself. width is 100% but of WHAT exactly?? see below lol */
        .theBtnImgThing {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: transform 0.15s ease;
        }

        /* this is the actual size control, NOT the img one. dont ask me why,
           past me figured it out at some point and past me is asleep rn */
        .clicky_wrap_dontTouch {
            display: block;
            width: 100%;
            max-width: 600px;
        }

        .theBtnImgThing:hover {
            transform: scale(1.02); /* barely does anything but felt wrong w/o it */
        }

        /* wraps the about img + the button so they stick together.
           if u remove this the button flies off somewhere idk, dont */
        .aboutThingyWrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            display: flex;
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .marquee-container:active {
            cursor: grabbing; 
        }

        .marquee-track {
            display: flex;
            gap: 40px; 
            padding-right: 40px; 
            width: max-content;
            animation: loopMarquee 40s linear infinite; 
        }

        .marquee-item {
            flex: 0 0 280px; 
            height: 280px;
            background-color: transparent; 
            border: 6px solid #000; 
            border-radius: 4px;
            overflow: hidden;
        }

        .marquee-item.wide {
            flex: 0 0 480px; 
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-container:active .marquee-track {
            animation-play-state: paused;
        }

        @keyframes loopMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000; 
            pointer-events: auto;
            animation: multiEdgeFloat var(--duration) linear forwards;
        }

        .floating-gif-item {
            width: 64px; 
            height: 64px;
            display: block;
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            user-select: none;
            -webkit-user-select: none; 
        }

        .floating-gif-item.shrinking {
            animation: slowThenFastShrink 1.0s linear forwards;
            pointer-events: none; 
        }

        @keyframes multiEdgeFloat {
            0% {
                transform: translate(var(--start-x), var(--start-y)) rotate(0deg);
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) rotate(var(--total-rot));
            }
        }

        @keyframes slowThenFastShrink {
            0% { transform: scale(1); }
            65% { transform: scale(0.7); } 
            100% { transform: scale(0); }
        }

        /* star burst stuff */
        .star-burst-container {
            position: fixed;
            z-index: 10001; 
            pointer-events: none; 
        }

        .star-particle {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            animation: starPop 1s ease-out forwards;
        }

        @keyframes starPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4);
            }
            30% {
                opacity: 1;
                transform: translate(calc(-50% + var(--star-x) * 0.5), calc(-50% + var(--star-y) * 0.5)) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--star-x)), calc(-50% + var(--star-y))) scale(0.6);
            }
        }

        #section-4 {
            width: 100%;
            padding: 60px 0;
            overflow: hidden;
            background-image: url('BackgroundS4.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollS4 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        @keyframes scrollS4 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-atcf-image {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            padding: 0 20px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

    <script>
        const gifLengthStuffIdk = 1800; 
        const GIF_SRC = 'PawcideS1.gif';
        const titleContainer = document.getElementById('title-container');
        const titleGif = document.getElementById('title-gif');
        let timerId = null;

        function playAnimation() {
            clearTimeout(timerId);
            titleContainer.classList.remove('stopped');
            titleContainer.classList.add('playing');
            titleGif.src = GIF_SRC + '?t=' + new Date().getTime();

            timerId = setTimeout(() => {
                titleContainer.classList.remove('playing');
                titleContainer.classList.add('stopped');
            }, gifLengthStuffIdk);
        }
        window.addEventListener('load', playAnimation);
        titleContainer.addEventListener('click', playAnimation);

        // clicked cats tracking thingy section
        const catThingKey = 'pawcide_clicked_cats';

        function getCatClickedThingIdk() {
            try {
                return JSON.parse(localStorage.getItem(catThingKey)) || [];
            } catch (e) {
                return []; 
            }
        }

        function catClickedThingDoStuff(filename) {
            const clicked = getCatClickedThingIdk();
            if (!clicked.includes(filename)) {
                clicked.push(filename);
                localStorage.setItem(catThingKey, JSON.stringify(clicked));
            }
            updateCatRowThingy();
        }

        function updateCatRowThingy() {
            const clicked = getCatClickedThingIdk();
            // covers both rows now, same key tracks everything so its fine
            document.querySelectorAll('#clicked-cats-row img, #rare-cats-row img').forEach(img => {
                if (clicked.includes(img.dataset.cat)) {
                    img.classList.add('unlocked');
                }
            });

            const allCatNamesWhatever = [...document.querySelectorAll('#clicked-cats-row img, #rare-cats-row img')].map(i => i.dataset.cat);
            const gotEmAll = allCatNamesWhatever.every(c => clicked.includes(c));
            const certEl = document.getElementById('certThingImg');
            const certSeenAlready = localStorage.getItem('pawcide_cert_seen');
            if (gotEmAll && certEl) {
                certEl.classList.add('certDoneYay');
                if (!certSeenAlready) {
                    localStorage.setItem('pawcide_cert_seen', '1');
                    doTheCertFlyThing();
                }
            }
        }

        window.addEventListener('load', updateCatRowThingy);

        // the big certificate moment. spawns huge in the middle, waits around, then zooms to where it lives
        function doTheCertFlyThing() {
            const certEl = document.getElementById('certThingImg');
            if (!certEl) return;

            const overlay = document.createElement('div');
            overlay.classList.add('certFlyBoiOverlay');
            const flyImg = document.createElement('img');
            flyImg.src = 'Pawrtificate.png';
            flyImg.classList.add('certFlyBoiImg');
            flyImg.style.opacity = '0';
            flyImg.style.transform = 'scale(0.1) rotate(-25deg)';
            flyImg.style.transition = 'transform 0.28s cubic-bezier(.2,1.4,.4,1), opacity 0.15s ease-out';
            overlay.appendChild(flyImg);
            document.body.appendChild(overlay);

            requestAnimationFrame(() => {
                flyImg.style.opacity = '1';
                flyImg.style.transform = 'scale(1) rotate(0deg)';
            });

            setTimeout(() => {
                const spot = certEl.getBoundingClientRect();
                const cur = flyImg.getBoundingClientRect();
                const dx = (spot.left + spot.width / 2) - (cur.left + cur.width / 2);
                const dy = (spot.top + spot.height / 2) - (cur.top + cur.height / 2);
                const scaleDown = spot.width / cur.width;

                flyImg.style.transition = 'transform 0.8s cubic-bezier(.15,.7,.3,1), opacity 0.15s ease-in 0.65s';
                flyImg.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleDown})`;
                flyImg.style.opacity = '0';

                setTimeout(() => {
                    overlay.remove();
                }, 900);
            }, 1800);
        }

        document.addEventListener('click', (e) => {
            const certEl = document.getElementById('certThingImg');
            if (certEl && e.target === certEl && certEl.classList.contains('certDoneYay')) {
                doTheCertFlyThing();
            }
        });

        // little star explosion for when you find a NEW cat you haven't seen before
        function doTheStarThing(x, y) {
            const container = document.createElement('div');
            container.classList.add('star-burst-container');
            container.style.left = x + 'px';
            container.style.top = y + 'px';

            const STAR_COUNT = 6;
            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('img');
                star.src = 'Star.png';
                star.alt = '';
                star.classList.add('star-particle');

                const angle = (Math.PI * 2 / STAR_COUNT) * i + (Math.random() * 0.5 - 0.25);
                const distance = Math.random() * 40 + 40; 
                star.style.setProperty('--star-x', Math.cos(angle) * distance + 'px');
                star.style.setProperty('--star-y', Math.sin(angle) * distance + 'px');
                star.style.animationDelay = (Math.random() * 0.1) + 's';

                container.appendChild(star);
            }

            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1100); 
        }

        const catSpawnListWhatever = ['Yourefunny.gif', 'Wave.gif', 'Silly.gif', 'Confused.gif', 'Amused.gif', 'Tired.gif', 'Calico.gif', 'NoReaction.gif', 'Dizzy.gif', 'Geeked.gif', 'OrangeTabby.gif'];
        // the SPECIAL ones. dont spawn as much, see rareChanceIdkPercent below
        const rareCatSpawnListShh = ['Blahh.gif', 'Hapi.gif', 'Sad.gif', 'Serioused.gif'];
        const rareChanceIdkPercent = 0.05; // 5%, splitting the difference between 1 (too stingy) and 40 (too generous)
        const maxCatsOnScreenIdk = 5;    
        const spawnEveryWhateverMs = 4000; 

        function makeFloatyCatIdk() {
            if (document.querySelectorAll('.floating-container').length >= maxCatsOnScreenIdk) {
                return;
            }

            const container = document.createElement('div');
            container.classList.add('floating-container');

            const gif = document.createElement('img');
            const rolledRareOMG = Math.random() < rareChanceIdkPercent;
            const pickFromHere = rolledRareOMG ? rareCatSpawnListShh : catSpawnListWhatever;
            gif.src = pickFromHere[Math.floor(Math.random() * pickFromHere.length)];
            gif.alt = "Floating Arcade Asset";
            gif.classList.add('floating-gif-item');

            const edges = ['bottom', 'top', 'left'];
            const chosenEdge = edges[Math.floor(Math.random() * edges.length)];

            let startX, startY, endX, endY;

            if (chosenEdge === 'bottom') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '105vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '-10vh';
            } else if (chosenEdge === 'top') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '-10vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '105vh';
            } else if (chosenEdge === 'left') {
                startX = '-10vw';
                startY = Math.floor(Math.random() * 90) + 5 + 'vh';
                endX = '105vw';
                endY = `calc(${startY} + ${(Math.random() * 20 - 10)}vh)`;
            }

            const flightTime = (Math.random() * 6 + 12) + 's';
            const turnSpeed = (Math.random() * 240 + 120) * (Math.random() > 0.5 ? 1 : -1) + 'deg';

            container.style.setProperty('--start-x', startX);
            container.style.setProperty('--start-y', startY);
            container.style.setProperty('--end-x', endX);
            container.style.setProperty('--end-y', endY);
            container.style.setProperty('--duration', flightTime);
            container.style.setProperty('--total-rot', turnSpeed);

            gif.addEventListener('click', (e) => {
                const filename = gif.src.split('/').pop();
                const isNewCat = !getCatClickedThingIdk().includes(filename);
                if (isNewCat) {
                    doTheStarThing(e.clientX, e.clientY);
                }
                catClickedThingDoStuff(filename); 
                gif.classList.add('shrinking');
                gif.addEventListener('animationend', () => {
                    container.remove();
                }, { once: true });
            });

            container.addEventListener('animationend', (e) => {
                if (e.target === container) {
                    container.remove();
                }
            });

            container.appendChild(gif);
            document.body.appendChild(container);
        }
        setInterval(makeFloatyCatIdk, spawnEveryWhateverMs);
