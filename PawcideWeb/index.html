<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawcide</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #111;
            font-family: sans-serif;
        }

        #section-1 {
            position: relative;
            z-index: 2; 
            width: 100%;
            aspect-ratio: 352 / 192; 
            background-image: url('BackgroundS1.png');
            background-repeat: no-repeat;
            background-size: 100% auto;
            background-position: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-wrapper {
            width: 100%;
            max-width: 600px; 
            padding: 20px;
            margin-top: 5vh;
            display: grid; 
            place-items: center;
            cursor: pointer;
        }

        .title-wrapper img {
            grid-area: 1 / 1; 
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: opacity 0.05s ease; 
        }

        .title-wrapper.playing #title-gif { opacity: 1; pointer-events: auto; }
        .title-wrapper.playing #title-still { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-gif { opacity: 0; pointer-events: none; }
        .title-wrapper.stopped #title-still { opacity: 1; pointer-events: auto; }

        #section-2 {
            position: relative;
            z-index: 1; 
            margin-top: -15vw; 
            padding: 15vw 20px 60px 20px;
            width: 100%;
            background-image: url('BackgroundS2.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollS2 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes scrollS2 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .clicked-cats-wrapper {
            position: relative; 
            width: 100%;
            max-width: 650px;
            margin-top: 40px;
        }

        .clicked-cats-image {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .clicked-cats-row {
            position: absolute; 
            top: 44%; 
            bottom: 6%;
            left: 6%;
            right: 6%;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start; 
            gap: 3% 2%;
        }

        .clicked-cats-row img {
            width: 10.5%; 
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: grayscale(100%) brightness(0.1) contrast(0.7); 
            transition: filter 0.3s ease; 
        }

        .clicked-cats-row img.unlocked {
            filter: none; 
        }

        #section-3 {
            width: 100%;
            padding: 60px 0; 
            overflow: hidden; 
            background-image: url('BackgroundS3.gif');
            background-repeat: repeat;
            background-size: 180px 180px; 
            animation: scrollS3 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px; 
        }

        @keyframes scrollS3 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .games-image {
            display: block;
            width: 100%;
            max-width: 650px; 
            height: auto;
            padding: 0 20px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            display: flex;
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .marquee-container:active {
            cursor: grabbing; 
        }

        .marquee-track {
            display: flex;
            gap: 40px; 
            padding-right: 40px; 
            width: max-content;
            animation: loopMarquee 40s linear infinite; 
        }

        .marquee-item {
            flex: 0 0 280px; 
            height: 280px;
            background-color: transparent; 
            border: 6px solid #000; 
            border-radius: 4px;
            overflow: hidden;
        }

        .marquee-item.wide {
            flex: 0 0 480px; 
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .marquee-container:active .marquee-track {
            animation-play-state: paused;
        }

        @keyframes loopMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000; 
            pointer-events: auto;
            animation: multiEdgeFloat var(--duration) linear forwards;
        }

        .floating-gif-item {
            width: 64px; 
            height: 64px;
            display: block;
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            user-select: none;
            -webkit-user-select: none; 
        }

        .floating-gif-item.shrinking {
            animation: slowThenFastShrink 1.0s linear forwards;
            pointer-events: none; 
        }

        @keyframes multiEdgeFloat {
            0% {
                transform: translate(var(--start-x), var(--start-y)) rotate(0deg);
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) rotate(var(--total-rot));
            }
        }

        @keyframes slowThenFastShrink {
            0% { transform: scale(1); }
            65% { transform: scale(0.7); } 
            100% { transform: scale(0); }
        }

        /* More Star stuff particle */
        .star-burst-container {
            position: fixed;
            z-index: 10001; 
            pointer-events: none; 
        }

        .star-particle {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            animation: starPop 1s ease-out forwards;
        }

        @keyframes starPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4);
            }
            30% {
                opacity: 1;
                transform: translate(calc(-50% + var(--star-x) * 0.5), calc(-50% + var(--star-y) * 0.5)) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--star-x)), calc(-50% + var(--star-y))) scale(0.6);
            }
        }

        #section-4 {
            width: 100%;
            padding: 60px 0;
            overflow: hidden;
            background-image: url('BackgroundS4.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollS4 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        @keyframes scrollS4 {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-atcf-image {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            padding: 0 20px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

    <script>
        const GIF_DURATION = 1800; 
        const GIF_SRC = 'PawcideS1.gif';
        const titleContainer = document.getElementById('title-container');
        const titleGif = document.getElementById('title-gif');
        let timerId = null;

        function playAnimation() {
            clearTimeout(timerId);
            titleContainer.classList.remove('stopped');
            titleContainer.classList.add('playing');
            titleGif.src = GIF_SRC + '?t=' + new Date().getTime();

            timerId = setTimeout(() => {
                titleContainer.classList.remove('playing');
                titleContainer.classList.add('stopped');
            }, GIF_DURATION);
        }
        window.addEventListener('load', playAnimation);
        titleContainer.addEventListener('click', playAnimation);

        // clicked cats tracking thingy section
        const CATS_KEY = 'pawcide_clicked_cats';

        function getClickedCats() {
            try {
                return JSON.parse(localStorage.getItem(CATS_KEY)) || [];
            } catch (e) {
                return []; 
            }
        }

        function markCatClicked(filename) {
            const clicked = getClickedCats();
            if (!clicked.includes(filename)) {
                clicked.push(filename);
                localStorage.setItem(CATS_KEY, JSON.stringify(clicked));
            }
            refreshClickedCatsRow();
        }

        function refreshClickedCatsRow() {
            const clicked = getClickedCats();
            document.querySelectorAll('#clicked-cats-row img').forEach(img => {
                if (clicked.includes(img.dataset.cat)) {
                    img.classList.add('unlocked');
                }
            });
        }

        window.addEventListener('load', refreshClickedCatsRow);

        // little star explosion for new cat
        function spawnStarBurst(x, y) {
            const container = document.createElement('div');
            container.classList.add('star-burst-container');
            container.style.left = x + 'px';
            container.style.top = y + 'px';

            const STAR_COUNT = 6;
            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('img');
                star.src = 'Star.png';
                star.alt = '';
                star.classList.add('star-particle');

                const angle = (Math.PI * 2 / STAR_COUNT) * i + (Math.random() * 0.5 - 0.25);
                const distance = Math.random() * 40 + 40; 
                star.style.setProperty('--star-x', Math.cos(angle) * distance + 'px');
                star.style.setProperty('--star-y', Math.sin(angle) * distance + 'px');
                star.style.animationDelay = (Math.random() * 0.1) + 's';

                container.appendChild(star);
            }

            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1100); 
        }

        const SPAWN_POOL = ['Yourefunny.gif', 'Wave.gif', 'Silly.gif', 'Confused.gif', 'Amused.gif', 'Tired.gif', 'Calico.gif', 'NoReaction.gif', 'Dizzy.gif', 'Geeked.gif', 'OrangeTabby.gif'];
        const MAX_SCREEN_ITEMS = 5;    
        const SPAWN_INTERVAL_MS = 4000; 

        function createFloatingElement() {
            if (document.querySelectorAll('.floating-container').length >= MAX_SCREEN_ITEMS) {
                return;
            }

            const container = document.createElement('div');
            container.classList.add('floating-container');

            const gif = document.createElement('img');
            gif.src = SPAWN_POOL[Math.floor(Math.random() * SPAWN_POOL.length)];
            gif.alt = "Floating Arcade Asset";
            gif.classList.add('floating-gif-item');

            const edges = ['bottom', 'top', 'left'];
            const chosenEdge = edges[Math.floor(Math.random() * edges.length)];

            let startX, startY, endX, endY;

            if (chosenEdge === 'bottom') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '105vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '-10vh';
            } else if (chosenEdge === 'top') {
                startX = Math.floor(Math.random() * 90) + 5 + 'vw';
                startY = '-10vh';
                endX = `calc(${startX} + ${(Math.random() * 20 - 10)}vw)`;
                endY = '105vh';
            } else if (chosenEdge === 'left') {
                startX = '-10vw';
                startY = Math.floor(Math.random() * 90) + 5 + 'vh';
                endX = '105vw';
                endY = `calc(${startY} + ${(Math.random() * 20 - 10)}vh)`;
            }

            const flightTime = (Math.random() * 6 + 12) + 's';
            const turnSpeed = (Math.random() * 240 + 120) * (Math.random() > 0.5 ? 1 : -1) + 'deg';

            container.style.setProperty('--start-x', startX);
            container.style.setProperty('--start-y', startY);
            container.style.setProperty('--end-x', endX);
            container.style.setProperty('--end-y', endY);
            container.style.setProperty('--duration', flightTime);
            container.style.setProperty('--total-rot', turnSpeed);

            gif.addEventListener('click', (e) => {
                const filename = gif.src.split('/').pop();
                const isNewCat = !getClickedCats().includes(filename);
                if (isNewCat) {
                    spawnStarBurst(e.clientX, e.clientY);
                }
                markCatClicked(filename); 
                gif.classList.add('shrinking');
                gif.addEventListener('animationend', () => {
                    container.remove();
                }, { once: true });
            });

            container.addEventListener('animationend', (e) => {
                if (e.target === container) {
                    container.remove();
                }
            });

            container.appendChild(gif);
            document.body.appendChild(container);
        }
        setInterval(createFloatingElement, SPAWN_INTERVAL_MS);
        //Made by pawcide. For Paweb :3 *licks you* *paws at you*  mrowp meowww
    </script>
