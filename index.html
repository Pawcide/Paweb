<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawcide - Links</title>
    <link rel="icon" type="image/png" href="PawebIcon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #111;
            font-family: sans-serif;
        }

        #section-links {
            width: 100%;
            min-height: 100vh;
            padding: 60px 0;
            overflow: hidden;
            background-image: url('BackgroundS1.gif');
            background-repeat: repeat;
            background-size: 180px 180px;
            animation: scrollLinks 12s linear infinite;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        @keyframes scrollLinks {
            from { background-position: 0 0; }
            to { background-position: -180px 180px; }
        }

        .about-links-image {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            padding: 0 20px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .linksThingyWrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
        }

        .btnPicThingy {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: transform 0.15s ease;
        }

        .clickyWrapIdk {
            display: block;
            width: 100%;
            max-width: 380px;
        }

        .btnPicThingy:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <section id="section-links">
        <div class="linksThingyWrap">
            <img src="AboutPawebLinks.png" alt="Paweb Links" class="about-links-image">

            <a href="https://pawcide.github.io/Paweb/AboutMe" class="clickyWrapIdk">
                <img src="GoToAboutMe.png" alt="Go to About Me" class="btnPicThingy">
            </a>

            <a href="https://pawcide.github.io/Paweb/Friends" class="clickyWrapIdk">
                <img src="GoToFriends.png" alt="Go to Friends" class="btnPicThingy">
            </a>

            <a href="https://pawcide.github.io/Paweb/Pawscript" class="clickyWrapIdk">
                <img src="GoToPawscript.png" alt="Go to Pawscript" class="btnPicThingy">
            </a>
        </div>
    </section>

</body>
</html>
